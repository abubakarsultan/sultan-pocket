<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sultan Pocket — Personal Finance Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F7F5EF;
  --bg-elev:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F1EFE7;
  --surface-3:#E7E3D8;
  --border:#DEDACC;
  --border-soft:#E9E5D9;
  --text:#252A20;
  --text-dim:#5E6656;
  --text-faint:#8D9284;
  --gold:#B07F33;
  --gold-dim:#E4CFA0;
  --blue:#3E6EA5;
  --blue-dim:#B7D0EA;
  --violet:#8656C4;
  --violet-dim:#DACBEF;
  --teal:#2A8563;
  --teal-dim:#A9DFC7;
  --rose:#BF5138;
  --rose-dim:#F0BEAE;
  --signal:#0057FF;
  --signal-dim:#B7CCFF;
  --radius-sm:4px;
  --radius:8px;
  --radius-lg:14px;
  --font-display:'Inter',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --shadow:0 8px 24px -8px rgba(0,0,0,0.12);
}
:root[data-theme="dark"]{
  --bg:#14161A;
  --bg-elev:#1B1E24;
  --surface:#1B1E24;
  --surface-2:#22262E;
  --surface-3:#2B303A;
  --border:#343B46;
  --border-soft:#282D36;
  --text:#EDEFF2;
  --text-dim:#A8AFBB;
  --text-faint:#6B7280;
  --gold:#E0B15F;
  --gold-dim:#5C4522;
  --blue:#7BAEE0;
  --blue-dim:#294160;
  --violet:#C39CEE;
  --violet-dim:#402C63;
  --teal:#58C7A2;
  --teal-dim:#1D4E3D;
  --rose:#E58671;
  --rose-dim:#5E2B21;
  --signal:#4C86FF;
  --signal-dim:#1F3B75;
  --shadow:0 8px 24px -8px rgba(0,0,0,0.55);
}
*{box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(176,127,51,0.06), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(0,87,255,0.06), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  transition:background-color .2s ease, color .2s ease;
}
::selection{background:var(--signal-dim);color:var(--text);}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--bg-elev);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px 8px;border-bottom:1px solid var(--border-soft);margin-bottom:18px;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--signal),var(--gold));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13.5px;letter-spacing:-.02em;color:#fff;flex-shrink:0;}
.brand-text .t1{font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.1;}
.brand-text .t2{font-size:10.5px;color:var(--text-faint);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  color:var(--text-dim);font-size:13.5px;font-weight:500;background:none;border:none;text-align:left;width:100%;
  transition:background .12s,color .12s;
}
.nav-item .ic{width:17px;text-align:center;font-size:14px;opacity:.85;}
.nav-item:hover{background:var(--surface);color:var(--text);}
.nav-item.active{background:var(--surface-2);color:var(--text);box-shadow:inset 2px 0 0 var(--signal);}
.nav-sep{height:1px;background:var(--border-soft);margin:10px 4px;}
.nav-foot{font-size:10.5px;color:var(--text-faint);padding:10px 8px 0;border-top:1px solid var(--border-soft);margin-top:8px;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(247,245,239,0.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);padding:14px 26px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;
}
.topbar-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.page-title{font-family:var(--font-display);font-size:22px;font-weight:600;}
.month-picker{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 12px;}
.month-picker select{background:none;border:none;color:var(--text);font-size:13px;font-weight:500;outline:none;}
.month-picker button{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);width:24px;height:24px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;}
.month-picker button:hover{color:var(--text);border-color:var(--signal-dim);}
.topbar-right{display:flex;gap:8px;flex-wrap:wrap;}
.content{padding:22px 26px 60px;flex:1;}
.view{display:none;animation:fadein .25s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
/* ---------- Buttons ---------- */
.btn{
  border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:600;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:transform .08s,border-color .12s,background .12s;
}
.btn:hover{border-color:var(--signal-dim);background:var(--surface-3);}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(155deg,var(--signal),#3E82FF);border-color:transparent;color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-gold{background:linear-gradient(155deg,var(--gold),var(--gold-dim));border-color:transparent;color:#1A1204;}
.btn-ghost{background:none;border:1px solid var(--border);}
.btn-danger{background:none;border:1px solid var(--rose-dim);color:var(--rose);}
.btn-danger:hover{background:rgba(225,115,94,0.1);}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn-block{width:100%;justify-content:center;}
.icon-btn{width:30px;height:30px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:13px;}
.icon-btn:hover{color:var(--text);border-color:var(--signal-dim);}
/* ---------- Quick actions ---------- */
.qa-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.qa-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 13px;
  display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text);
  transition:border-color .12s,background .12s,transform .1s;
}
.qa-btn:hover{border-color:var(--signal-dim);background:var(--surface-2);transform:translateY(-1px);}
.qa-btn .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:14px;}
.grid-cards{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.card{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:16px 18px;
  position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:var(--accent,transparent);}
.card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.card .lbl .dot{width:7px;height:7px;border-radius:50%;}
.card .amt{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.1;}
.card .sub{font-size:11.5px;color:var(--text-faint);margin-top:6px;}
.card.hero{padding:20px 22px;}
.card.hero .amt{font-size:32px;}
.section-title{font-family:var(--font-display);font-size:16px;font-weight:600;margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.section-title .hint{font-family:var(--font-body);font-size:11.5px;color:var(--text-faint);font-weight:500;}
.panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:18px 20px;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
/* mini bars */
.bar-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px;}
.bar-row .name{width:100px;flex-shrink:0;color:var(--text-dim);}
.bar-track{flex:1;height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--teal);}
.bar-row .val{width:88px;text-align:right;flex-shrink:0;}
/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{text-align:left;color:var(--text-faint);font-weight:600;font-size:10.8px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:999px;font-size:10.8px;font-weight:600;border:1px solid transparent;}
.pill .dot{width:6px;height:6px;border-radius:50%;}
.row-actions{display:flex;gap:5px;}
.amt-pos{color:var(--teal);font-weight:600;}
.amt-neg{color:var(--rose);font-weight:600;}
.amt-neu{color:var(--text-dim);}
.empty-row td{text-align:center;color:var(--text-faint);padding:34px 10px;}
/* ---------- Filters bar ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filters select,.filters input[type=text],.filters input[type=search]{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12.5px;outline:none;
}
.filters input[type=search]{min-width:180px;}
.filters select:focus,.filters input:focus{border-color:var(--signal-dim);}
/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(6,9,7,0.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2;}
.modal-head h3{font-family:var(--font-display);font-size:17px;margin:0;font-weight:600;}
.modal-body{padding:18px 20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 11px;font-size:13.5px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--signal-dim);}
.field textarea{resize:vertical;min-height:56px;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:38px;}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:6px;background:none;border:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:14px;}
.pw-eye:hover{color:var(--text-dim);}
.theme-toggle{position:fixed;top:14px;right:14px;z-index:500;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:var(--shadow);}
.theme-toggle:hover{color:var(--text);border-color:var(--signal-dim);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px;}
.seg button{flex:1;background:none;border:none;color:var(--text-dim);padding:7px 8px;border-radius:6px;font-size:12px;font-weight:600;}
.seg button.active{background:var(--surface-3);color:var(--text);box-shadow:0 0 0 1px var(--border);}
.modal-foot{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border-soft);}
.form-hint{font-size:11px;color:var(--text-faint);margin-top:-6px;margin-bottom:14px;}
.form-error{font-size:12px;color:var(--rose);margin-bottom:10px;display:none;}
/* ---------- Charts ---------- */
.chart-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:16px 18px;}
.chart-card h4{font-family:var(--font-display);font-size:14.5px;margin:0 0 12px;font-weight:600;}
.chart-box{position:relative;height:230px;}
.chart-box.tall{height:270px;}
/* ---------- Empty states ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty .ic{font-size:30px;margin-bottom:10px;opacity:.5;}
.empty .t{font-size:13.5px;color:var(--text-dim);font-weight:600;margin-bottom:4px;}
.empty .d{font-size:12px;}
/* ---------- People / debt cards ---------- */
.person-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.person-card .name{font-weight:700;font-size:13.5px;}
.person-card .meta{font-size:11px;color:var(--text-faint);margin-top:3px;}
.badge{padding:2.5px 8px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.badge.owing{background:rgba(225,115,94,0.15);color:var(--rose);}
.badge.paid{background:rgba(73,185,150,0.15);color:var(--teal);}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface-3);border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:8px;padding:10px 16px;font-size:12.5px;box-shadow:var(--shadow);animation:fadein .2s ease;}
.toast.err{border-left-color:var(--rose);}
.mobile-nav-toggle{display:none;}
@media(max-width:880px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .2s;width:230px;}
  .sidebar.open{transform:translateX(0);}
  .mobile-nav-toggle{display:flex;}
  .two-col{grid-template-columns:1fr;}
  .content{padding:16px;}
  .topbar{padding:12px 16px;}
}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;}
.mobile-overlay.active{display:block;}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle light/dark theme">🌙</button>
<div id="authScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div class="panel" style="width:100%;max-width:400px;">
    <div style="text-align:center;margin-bottom:20px;">
      <div class="brand-mark" style="margin:0 auto 10px;">SP</div>
      <div style="font-family:var(--font-display);font-size:19px;font-weight:600;">Sultan Pocket</div>
      <div style="font-size:10.5px;color:var(--text-faint);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;">Personal Finance Ledger</div>
    </div>
    <div class="seg" style="margin-bottom:16px;">
      <button type="button" id="authTabLogin" class="active" onclick="setAuthTab('login')">Sign In</button>
      <button type="button" id="authTabSignup" onclick="setAuthTab('signup')">Sign Up</button>
    </div>
    <div class="form-error" id="authError"></div>
    <div id="authFormWrap"></div>
    <div id="authNotice" style="font-size:12px;color:var(--signal);margin-top:10px;text-align:center;display:none;line-height:1.5;"></div>
  </div>
</div>
<div class="shell" id="appShell" style="display:none;">
  <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">SP</div>
      <div class="brand-text">
        <div class="t1">Sultan Pocket</div>
        <div class="t2">Finance Ledger</div>
      </div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="nav-foot">
      <div id="userBadge" style="font-weight:600;color:var(--text);margin-bottom:8px;font-size:12px;"></div>
      <button class="btn btn-ghost btn-sm btn-block" onclick="handleSignOut()">Sign Out</button>

  </aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="icon-btn mobile-nav-toggle" onclick="toggleSidebar(true)">☰</button>
        <div class="page-title" id="pageTitle">Dashboard</div>

          <button onclick="shiftMonth(-1)">‹</button>
          <select id="monthSelect" onchange="setMonth(this.value)"></select>
          <button onclick="shiftMonth(1)">›</button>

      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost btn-sm" onclick="openModal('income')">+ Income</button>
        <button class="btn btn-ghost btn-sm" onclick="openModal('expense')">+ Expense</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Add</h3>
      <button class="icon-btn" onclick="closeModal()">✕</button>

    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="submitModal()">Save</button>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script>
/* =========================================================================
   Wallet — Personal Finance Tracker
   Data model, calculation engine, and UI rendering.
   Each signed-in user's data is stored in Supabase (cloud), scoped to
   their own account via Row Level Security.
   ========================================================================= */
const SUPABASE_URL = 'https://xhtmwdtzxrhgzqycgkwz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sp6jBpFtBiw2f4BCssvZyw_U8Bf3Bvt';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let CURRENT_USER = null;
const DEFAULT_CATEGORIES = ['Transport','Food','Shopping','Bills','Entertainment','Education','Personal','Other'];
let STATE = {
  nextId: 1,
  transactions: [],
  customCategories: []
};
let CURRENT_MONTH = todayISO().slice(0,7);
let charts = {};
/* ---------------------------- date helpers ---------------------------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthOf(dateStr){ return dateStr.slice(0,7); }
function lastDayOfMonth(m){
  const [y,mo] = m.split('-').map(Number);
  const d = new Date(y, mo, 0).getDate();
  return `${m}-${String(d).padStart(2,'0')}`;
}
function firstDayOfMonth(m){ return `${m}-01`; }
function shiftMonthStr(m, delta){
  let [y,mo] = m.split('-').map(Number);
  mo += delta;
  while(mo>12){mo-=12;y++;}
  while(mo<1){mo+=12;y--;}
  return `${y}-${String(mo).padStart(2,'0')}`;
}
function monthLabel(m){
  const [y,mo] = m.split('-').map(Number);
  return new Date(y, mo-1, 1).toLocaleString('en-US',{month:'long',year:'numeric'});
}
function monthAsOfCutoff(m){
  const real = todayISO();
  if(m === real.slice(0,7)) return real;
  const last = lastDayOfMonth(m);
  return last < real ? last : real;
}
function fmt(n){
  const neg = n < 0;
  const v = Math.round(Math.abs(n)).toLocaleString('en-US');
  return (neg?'-':'') + 'Rs. ' + v;
}
function fmtShort(n){
  return 'Rs. ' + Math.round(n).toLocaleString('en-US');
}
function uid(){ return STATE.nextId++; }
/* ---------------------------- persistence (Supabase, per-user) ---------------------------- */
async function loadData(){
  try{
    const { data, error } = await sb
      .from('wallet_data')
      .select('data')
      .eq('user_id', CURRENT_USER.id)
      .maybeSingle();
    if(error) throw error;
    if(data && data.data && Object.keys(data.data).length){
      STATE = Object.assign({nextId:1,transactions:[],customCategories:[]}, data.data);
    } else {
      STATE = {nextId:1, transactions:[], customCategories:[]};
    }
  }catch(e){
    console.error('Load failed', e);
    STATE = {nextId:1, transactions:[], customCategories:[]};
    showToast('Could not load your data. Please refresh and try again.', true);
  }
}
let saveInFlight = false, saveQueued = false;
async function saveData(){
  if(!CURRENT_USER) return;
  if(saveInFlight){ saveQueued = true; return; }
  saveInFlight = true;
  try{
    const { error } = await sb
      .from('wallet_data')
      .upsert({ user_id: CURRENT_USER.id, data: STATE, updated_at: new Date().toISOString() });
    if(error) throw error;
  }catch(e){
    console.error('Save failed', e);
    showToast('Could not save data. Your changes may not persist.', true);
  }finally{
    saveInFlight = false;
    if(saveQueued){ saveQueued = false; saveData(); }
  }
}

/* ---------------------------- core calculation engine ---------------------------- */
function computeBalances(uptoDate){
  let cash=0, online=0, etransit=0, savings=0, owed=0, repaidTotal=0, borrowedTotal=0, borrowedTotalAll=0;
  const txs = STATE.transactions.filter(t => !uptoDate || t.date <= uptoDate);
  for(const t of txs){
    switch(t.type){
      case 'stipend':
      case 'income_other':
        if(t.method==='cash') cash+=t.amount; else online+=t.amount;
        break;
      case 'borrow':
        if(t.method==='cash') cash+=t.amount; else online+=t.amount;
        borrowedTotalAll += t.amount;
        if(t.repayRequired){ borrowedTotal += t.amount; owed += t.amount; }
        break;
      case 'repay':
        if(t.method==='cash') cash-=t.amount; else online-=t.amount;
        owed -= t.amount;
        repaidTotal += t.amount;
        break;
      case 'expense':
        if(t.method==='cash') cash-=t.amount;
        else if(t.method==='online') online-=t.amount;
        else if(t.method==='etransit') etransit-=t.amount;
        break;
      case 'transfer':
        if(t.from==='cash'){ cash-=t.amount; online+=t.amount; }
        else { online-=t.amount; cash+=t.amount; }
        break;
      case 'withdraw':
        online -= t.amount; cash += t.amount;
        break;
      case 'etransit_add':
        if(t.from==='cash') cash-=t.amount; else online-=t.amount;
        etransit += t.amount;
        break;
      case 'savings_add':
        if(t.method==='cash') cash-=t.amount; else online-=t.amount;
        savings += t.amount;
        break;
      case 'savings_use':
        savings -= t.amount;
        if(t.destination==='cash') cash+=t.amount; else online+=t.amount;
        break;
    }
  }
  const available = cash + online;
  const total = available + savings + etransit;
  return {cash,online,etransit,savings,owed,repaidTotal,borrowedTotal,borrowedTotalAll,available,total};
}
function currentBalances(){ return computeBalances(monthAsOfCutoff(CURRENT_MONTH)); }
function monthTransactions(m){
  return STATE.transactions.filter(t => monthOf(t.date) === m);
}
function getMonthStats(m){
  const txs = monthTransactions(m);
  const stipend = sumBy(txs, t=>t.type==='stipend', 'amount');
  const incomeOtherTxs = txs.filter(t=>t.type==='income_other');
  const family = sumBy(incomeOtherTxs, t=>/family|ghar/i.test(t.source||''), 'amount');
  const pubg = sumBy(incomeOtherTxs, t=>/pubg|wow/i.test(t.source||''), 'amount');
  const otherIncome = sumBy(incomeOtherTxs, t=>!/family|ghar/i.test(t.source||'') && !/pubg|wow/i.test(t.source||''), 'amount');
  const borrowedReceived = sumBy(txs, t=>t.type==='borrow', 'amount');
  const repayments = sumBy(txs, t=>t.type==='repay', 'amount');
  const savingsAdded = sumBy(txs, t=>t.type==='savings_add', 'amount');
  const savingsUsed = sumBy(txs, t=>t.type==='savings_use', 'amount');
  const etransitAdded = sumBy(txs, t=>t.type==='etransit_add', 'amount');
  const expenseTxs = txs.filter(t=>t.type==='expense');
  const totalExpenses = sumBy(expenseTxs, ()=>true, 'amount');
  const byCategory = {};
  expenseTxs.forEach(t=>{ byCategory[t.category] = (byCategory[t.category]||0) + t.amount; });
  const etransitUsed = sumBy(expenseTxs, t=>t.method==='etransit', 'amount');
  const transportOther = sumBy(expenseTxs, t=>t.category==='Transport' && t.method!=='etransit', 'amount');
  const totalTransport = etransitUsed + transportOther;
  const cashSpent = sumBy(expenseTxs, t=>t.method==='cash', 'amount');
  const onlineSpent = sumBy(expenseTxs, t=>t.method==='online', 'amount');
  const prevMonth = shiftMonthStr(m, -1);
  const carryForwardBal = computeBalances(lastDayOfMonth(prevMonth));
  const carryForward = STATE.transactions.some(t=>t.date < firstDayOfMonth(m)) ? carryForwardBal.available : 0;
  const totalIn = stipend+family+pubg+otherIncome+borrowedReceived;
  const asOf = monthAsOfCutoff(m);
  const bal = computeBalances(asOf);
  return {
    month:m, stipend, family, pubg, otherIncome, borrowedReceived, repayments,
    savingsAdded, savingsUsed, etransitAdded, etransitUsed, transportOther, totalTransport,
    totalExpenses, byCategory, cashSpent, onlineSpent, carryForward, prevMonth, totalIn, balances:bal
  };
}
function sumBy(arr, pred, field){
  return arr.filter(pred).reduce((s,t)=>s+ (t[field]||0), 0);
}
function allMonthsList(){
  const set = new Set(STATE.transactions.map(t=>monthOf(t.date)));
  set.add(todayISO().slice(0,7));
  set.add(CURRENT_MONTH);
  return Array.from(set).sort().reverse();
}
/* people / debt */
function peopleSummary(){
  const people = {};
  STATE.transactions.forEach(t=>{
    if(t.type==='borrow'){
      people[t.person] = people[t.person] || {borrowed:0,repaid:0,owed:0,reqBorrowed:0};
      people[t.person].borrowed += t.amount;
      if(t.repayRequired){ people[t.person].reqBorrowed += t.amount; people[t.person].owed += t.amount; }
    }
    if(t.type==='repay'){
      people[t.person] = people[t.person] || {borrowed:0,repaid:0,owed:0,reqBorrowed:0};
      people[t.person].repaid += t.amount;
      people[t.person].owed -= t.amount;
    }
  });
  return people;
}

function showToast(msg, isErr){

function typeLabel(t){
  const map = {
    stipend:'Monthly Stipend', income_other:'Other Income', borrow:'Borrowed Money', repay:'Repayment',
    expense:'Expense', transfer: t.from==='cash' ? 'Cash → Online Transfer' : 'Online → Cash Transfer',
    withdraw:'Withdrawal: Online → Cash', etransit_add:'Add to E-Transit Wallet',
    savings_add:'Savings Added', savings_use:'Savings Used'
  };
  return map[t.type] || t.type;
}
function typePillColor(type){
  return ({
    stipend:'teal', income_other:'teal', borrow:'gold', repay:'rose', expense:'rose',
    transfer:'blue', withdraw:'blue', etransit_add:'violet', savings_add:'teal', savings_use:'gold'
  })[type] || 'blue';
}
function methodOfTx(t){
  if(t.type==='transfer') return `${t.from}→${t.to}`;
  if(t.type==='withdraw') return 'online→cash';
  if(t.type==='etransit_add') return `${t.from}→etransit`;
  if(t.type==='savings_add') return t.method;
  if(t.type==='savings_use') return `savings→${t.destination}`;
  return t.method || '—';
}
function txEffect(t){
  switch(t.type){
    case 'stipend': case 'income_other': case 'borrow': return {sign:1, val:t.amount};
    case 'repay': case 'expense': return {sign:-1, val:t.amount};
    case 'savings_add': return {sign:-1, val:t.amount};
    case 'savings_use': return {sign:1, val:t.amount};
    default: return {sign:0, val:t.amount};
  }
}

   TRANSACTIONS TABLE (shared renderer)
   ========================================================================= */
function txFields(t){
  const catSource = t.type==='expense' ? t.category
    : (t.type==='stipend' ? 'Monthly Stipend'
    : (t.type==='income_other' ? t.source
    : (t.type==='savings_add' ? `Savings (${t.sourceMonth||''})`
    : (t.type==='savings_use' ? (t.reason||'Savings Use') : '—'))));
  const person = t.person || '—';
  const desc = t.description || t.notes || '—';
  return {catSource, person, desc};
}
function transactionsTable(list, showActions=true){
  if(list.length===0) return emptyState('No transactions found.', 'Try adjusting your filters, or add one using the quick actions.');
  const rows = list.map(t=>{
    const f = txFields(t);
    const eff = txEffect(t);
    const amtClass = eff.sign>0?'amt-pos':(eff.sign<0?'amt-neg':'amt-neu');
    const amtPrefix = eff.sign>0?'+':(eff.sign<0?'−':'');
    const col = typePillColor(t.type);
    return `<tr>
      <td>${t.date}</td>
      <td><span class="pill" style="background:rgba(0,0,0,0.001);border-color:var(--border);color:var(--text-dim);"><span class="dot" style="background:var(--${col})"></span>${typeLabel(t)}</span></td>
      <td class="num ${amtClass}">${amtPrefix}${fmtShort(t.amount)}</td>
      <td>${f.catSource}</td>
      <td>${methodOfTx(t)}</td>
      <td>${f.person}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;">${f.desc}</td>
      ${showActions?`<td><div class="row-actions">
        <button class="icon-btn" style="width:26px;height:26px;font-size:11px;" onclick="editTransaction(${t.id})">✎</button>
        <button class="icon-btn" style="width:26px;height:26px;font-size:11px;" onclick="deleteTransaction(${t.id})">✕</button>
      </div></td>`:''}
    </tr>`;
  }).join('');
  return `<table><thead><tr>
    <th>Date</th><th>Type</th><th>Amount</th><th>Category / Source</th><th>Method</th><th>Person</th><th>Notes</th>${showActions?'<th></th>':''}
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function viewSavings(){

  const list = STATE.transactions.filter(t=>t.type==='savings_add' || t.type==='savings_use');
  list.sort((a,b2)=>b2.date.localeCompare(a.date) || b2.id-a.id);

    <div class="card"><div class="lbl"><span class="dot" style="background:var(--gold)"></span>Prev. Month Carry-Forward</div><div class="amt num">${fmt(s.carryForward)}</div><div class="sub">Unsaved leftover from ${monthLabel(s.prevMonth)}</div></div>

function viewDebt(){
  const b = currentBalances();

  const names = Object.keys(people);
  const personCards = names.map(name=>{
    const p = people[name];

    return `<div class="person-card">
      <div>

        <div class="num" style="font-weight:700;font-size:15px;color:${paid?'var(--teal)':'var(--rose)'}">${fmt(Math.max(p.owed,0))}</div>
        <span class="badge ${paid?'paid':'owing'}">${paid?'Fully Paid':'Owing'}</span>
      </div>

    <div class="card hero" style="--accent:var(--rose)"><div class="lbl"><span class="dot" style="background:var(--rose)"></span>Money Still Owed</div><div class="amt num">${fmt(b.owed)}</div></div>

function destroyCharts(){
  Object.values(charts).forEach(c=>c && c.destroy());
  charts = {};
}
const CHART_COLORS = ['#D9AD52','#49B996','#6FA3D8','#B98CE6','#E1735E','#8A9C90','#E8B86D','#5D8A73'];
function chartOpts(extra){
  return Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{labels:{color:'#5E6656', font:{size:11, family:'Inter'}}} },
    scales:{}
  }, extra||{});
}
function renderAllCharts(){
  destroyCharts();
  const s = getMonthStats(CURRENT_MONTH);
  const b = s.balances;
  const catLabels = Object.keys(s.byCategory);
  const catData = Object.values(s.byCategory);
  charts.category = new Chart(document.getElementById('chartCategory'), {
    type:'doughnut',
    data:{ labels: catLabels.length?catLabels:['No expenses'], datasets:[{data: catData.length?catData:[1], backgroundColor: CHART_COLORS, borderColor:'#FFFFFF', borderWidth:2}] },
    options: chartOpts({plugins:{legend:{position:'bottom', labels:{color:'#5E6656',font:{size:10.5}}}}})
  });
  charts.balances = new Chart(document.getElementById('chartBalances'), {
    type:'doughnut',
    data:{ labels:['Cash','Online','Savings','E-Transit'], datasets:[{data:[Math.max(b.cash,0),Math.max(b.online,0),Math.max(b.savings,0),Math.max(b.etransit,0)], backgroundColor:['#D9AD52','#6FA3D8','#49B996','#B98CE6'], borderColor:'#FFFFFF', borderWidth:2}] },
    options: chartOpts({plugins:{legend:{position:'bottom', labels:{color:'#5E6656',font:{size:10.5}}}}})
  });
  const incLabels = ['Stipend','Family','PUBG WOW','Other','Borrowed'];
  const incData = [s.stipend, s.family, s.pubg, s.otherIncome, s.borrowedReceived];
  charts.income = new Chart(document.getElementById('chartIncome'), {
    type:'pie',
    data:{ labels:incLabels, datasets:[{data:incData.some(x=>x>0)?incData:[1,0,0,0,0], backgroundColor: CHART_COLORS, borderColor:'#FFFFFF', borderWidth:2}] },
    options: chartOpts({plugins:{legend:{position:'bottom', labels:{color:'#5E6656',font:{size:10.5}}}}})
  });
  charts.transport = new Chart(document.getElementById('chartTransport'), {
    type:'bar',
    data:{ labels:['E-Transit Loaded','E-Transit Used','Other Transport'], datasets:[{data:[s.etransitAdded, s.etransitUsed, s.transportOther], backgroundColor:['#B98CE6','#E1735E','#D9AD52'], borderRadius:6}] },
    options: chartOpts({plugins:{legend:{display:false}}, scales:{x:{ticks:{color:'#5E6656',font:{size:10.5}},grid:{display:false}}, y:{ticks:{color:'#5E6656'},grid:{color:'#DEDACC'}}}})
  });
  const months6 = [];
  for(let i=5;i>=0;i--) months6.push(shiftMonthStr(CURRENT_MONTH,-i));
  const spendData = months6.map(m=>getMonthStats(m).totalExpenses);
  const incData6 = months6.map(m=>getMonthStats(m).totalIn);
  charts.monthly = new Chart(document.getElementById('chartMonthly'), {
    type:'bar',
    data:{ labels:months6.map(m=>monthLabel(m).split(' ')[0]+' '+monthLabel(m).split(' ')[1].slice(2)),
      datasets:[
        {label:'Income', data:incData6, backgroundColor:'#49B99688', borderRadius:5},
        {label:'Expenses', data:spendData, backgroundColor:'#E1735E88', borderRadius:5}
      ]},
    options: chartOpts({scales:{x:{ticks:{color:'#5E6656'},grid:{display:false}}, y:{ticks:{color:'#5E6656'},grid:{color:'#DEDACC'}}}})
  });
  const savingsData = months6.map(m=>computeBalances(lastDayOfMonth(m)).savings);
  charts.savings = new Chart(document.getElementById('chartSavings'), {
    type:'line',
    data:{ labels:months6.map(m=>monthLabel(m)),
      datasets:[{label:'Savings Balance', data:savingsData, borderColor:'#D9AD52', backgroundColor:'#D9AD5222', fill:true, tension:.35, pointBackgroundColor:'#D9AD52'}] },
    options: chartOpts({scales:{x:{ticks:{color:'#5E6656'},grid:{display:false}}, y:{ticks:{color:'#5E6656'},grid:{color:'#DEDACC'}}}})
  });
}
/* =========================================================================
   MODAL / FORM SYSTEM
   ========================================================================= */
let currentModal = {kind:null, editId:null};
function segControl(id, options, selected){
  return `<div class="seg" id="seg_${id}">
    ${options.map(([v,l])=>`<button type="button" class="${v===selected?'active':''}" onclick="setSeg('${id}','${v}')">${l}</button>`).join('')}
    <input type="hidden" id="${id}" value="${selected}">
  </div>`;
}
function setSeg(id, val){
  document.getElementById(id).value = val;
  const wrap = document.getElementById('seg_'+id);
  [...wrap.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('active', b.textContent.trim()===val || b.getAttribute('onclick').includes(`'${val}'`)));
  if(id==='m_incomeType') refreshIncomeSourceField(val);
}
const MODAL_TITLES = {
  income:'Add Income', expense:'Add Expense', borrow:'Borrow Money', repay:'Repay Money',
  savings_add:'Add Savings', savings_use:'Use Savings', transfer:'Cash / Online Transfer',
  withdraw:'Withdraw Online → Cash', etransit_add:'Add to E-Transit Wallet', etransit_expense:'Add Transport Expense (E-Transit)'
};
function openModal(kind, editId=null){
  currentModal = {kind, editId};
  const existing = editId ? STATE.transactions.find(t=>t.id===editId) : null;
  document.getElementById('modalTitle').textContent = (editId?'Edit — ':'') + MODAL_TITLES[kind];
  document.getElementById('modalBody').innerHTML = buildModalBody(kind, existing);
  document.getElementById('modalOverlay').classList.add('active');
  if(kind==='income'){
    const isStipend = existing ? existing.type==='stipend' : true;
    refreshIncomeSourceField(isStipend?'stipend':'other');
    if(existing && existing.type==='income_other'){
      const s = document.getElementById('m_source');
      if(s) s.value = existing.source;
    }
  }
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
  currentModal = {kind:null, editId:null};
}
function editTransaction(id){
  const t = STATE.transactions.find(x=>x.id===id);
  if(!t) return;
  let kind = t.type;
  if(t.type==='stipend' || t.type==='income_other') kind = 'income';
  else if(t.type==='expense' && t.method==='etransit') kind = 'etransit_expense';
  else if(t.type==='expense') kind = 'expense';
  openModal(kind, id);
}
function categorySelectHtml(selected){
  const cats = allCategories();
  return `<select id="m_category" onchange="if(this.value==='__new__'){document.getElementById('m_catNewWrap').style.display='block';}else{document.getElementById('m_catNewWrap').style.display='none';} updateExpenseMethodOptions(this.value);">
    ${cats.map(c=>`<option value="${c}" ${c===selected?'selected':''}>${c}</option>`).join('')}
    <option value="__new__">+ New category…</option>
  </select>
  <div id="m_catNewWrap" style="display:none;margin-top:8px;"><input type="text" id="m_catNew" placeholder="New category name"></div>`;
}
function expenseMethodSeg(selected, category){
  const showEtransit = category === 'Transport';
  const options = [['cash','Cash'],['online','Online']];
  if(showEtransit) options.push(['etransit','E-Transit Wallet']);
  const sel = (selected==='etransit' && !showEtransit) ? 'cash' : selected;
  return segControl('m_method', options, sel);
}
function updateExpenseMethodOptions(category){
  const wrap = document.getElementById('m_methodWrap');
  if(!wrap) return;
  const currentEl = document.getElementById('m_method');
  const current = currentEl ? currentEl.value : 'cash';
  wrap.innerHTML = expenseMethodSeg(current, category);
}
function refreshIncomeSourceField(type){
  const wrap = document.getElementById('m_sourceFieldWrap');
  if(!wrap) return;
  if(type==='stipend'){
    wrap.innerHTML = `<label>Source</label><input type="text" id="m_source" value="Monthly Stipend" readonly>`;
  } else {
    wrap.innerHTML = `<label>Source</label><select id="m_source">
      <option value="Family / Ghar Walay">Family / Ghar Walay</option>
      <option value="PUBG Mobile WOW Creator Earnings">PUBG Mobile WOW Creator Earnings</option>
      <option value="Other Income">Other Income</option>
    </select>`;
  }
}

      <div class="field"><label>Withdrawal Method (optional)</label><input type="text" id="m_method2" value="${ex?ex.method2||'':''}" placeholder="e.g. ATM, JazzCash agent"></div>
      <div class="field"><label>Notes</label><textarea id="m_notes">${ex?ex.notes||'':''}</textarea></div>
      <div class="form-hint">Withdrawing does not change your Total Money — it only moves it from Online to Cash.</div>
      `;
    }
    case 'etransit_add': {
      return `
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="m_date" value="${date}"></div>
        <div class="field"><label>Amount (Rs.)</label><input type="number" id="m_amount" min="0" value="${ex?ex.amount:''}" placeholder="0"></div>
      </div>
      <div class="field"><label>From</label>${segControl('m_from',[['cash','Cash'],['online','Online']], ex?ex.from:'cash')}</div>
      <div class="field"><label>Notes</label><textarea id="m_notes">${ex?ex.notes||'':''}</textarea></div>
      <div class="form-hint">Loading your E-Transit wallet is not an expense yet — it only becomes a Transport expense when you actually spend it on a fare.</div>
      `;
    }
    case 'etransit_expense': {
      return `
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="m_date" value="${date}"></div>
        <div class="field"><label>Amount (Rs.)</label><input type="number" id="m_amount" min="0" value="${ex?ex.amount:''}" placeholder="0"></div>
      </div>
      <div class="field"><label>Description</label><input type="text" id="m_description" value="${ex?ex.description||'':''}" placeholder="e.g. Metro bus fare"></div>
      <div class="field"><label>Notes</label><textarea id="m_notes">${ex?ex.notes||'':''}</textarea></div>
      <div class="form-hint">This is deducted from your E-Transit Wallet balance and recorded as a Transport expense.</div>
      `;
    }
  }
  return '';
}
function readNum(id){ const v = parseFloat(document.getElementById(id).value); return isNaN(v)?0:v; }
function readVal(id){ const el = document.getElementById(id); return el?el.value.trim():''; }
function submitModal(){
  const {kind, editId} = currentModal;
  const date = readVal('m_date');
  const amount = readNum('m_amount');
  const notes = readVal('m_notes');
  if(!date){ showToast('Please choose a date.', true); return; }
  if(!amount || amount<=0){ showToast('Please enter an amount greater than zero.', true); return; }
  let tx = null;
  if(kind==='income'){
    const type = readVal('m_incomeType')==='stipend' ? 'stipend' : 'income_other';
    const source = type==='stipend' ? 'Monthly Stipend' : readVal('m_source');
    const method = readVal('m_method');
    tx = {type, date, amount, source, method, notes};
  } else if(kind==='expense' || kind==='etransit_expense'){
    let category = kind==='etransit_expense' ? 'Transport' : readVal('m_category');
    if(category==='__new__'){
      category = readVal('m_catNew') || 'Other';
      if(!STATE.customCategories.includes(category)) STATE.customCategories.push(category);
    }
    const method = kind==='etransit_expense' ? 'etransit' : readVal('m_method');
    const description = readVal('m_description');
    tx = {type:'expense', date, amount, category, method, description, notes};
  } else if(kind==='borrow'){
    const person = readVal('m_person');
    if(!person){ showToast("Please enter the person's name.", true); return; }
    const method = readVal('m_method');
    const repayRequired = readVal('m_repayRequired')==='yes';
    tx = {type:'borrow', date, amount, person, method, repayRequired, notes};
  } else if(kind==='repay'){
    const person = readVal('m_person');
    if(!person){ showToast('No person selected.', true); return; }
    const method = readVal('m_method');
    tx = {type:'repay', date, amount, person, method, notes};
  } else if(kind==='savings_add'){
    const method = readVal('m_method');
    const sourceMonth = readVal('m_sourceMonth') || monthOf(date);
    tx = {type:'savings_add', date, amount, method, sourceMonth, notes};
  } else if(kind==='savings_use'){
    const destination = readVal('m_destination');
    const reason = readVal('m_reason');
    tx = {type:'savings_use', date, amount, destination, reason, notes};
  } else if(kind==='transfer'){
    const from = readVal('m_from');
    let to = readVal('m_to');
    if(to===from) to = from==='cash'?'online':'cash';
    const person = readVal('m_person');
    tx = {type:'transfer', date, amount, from, to, person, notes};
  } else if(kind==='withdraw'){
    const method2 = readVal('m_method2');
    tx = {type:'withdraw', date, amount, method2, notes};
  } else if(kind==='etransit_add'){
    const from = readVal('m_from');
    tx = {type:'etransit_add', date, amount, from, notes};
  }
  if(!tx){ closeModal(); return; }
  if(editId){
    tx.id = editId;
    const idx = STATE.transactions.findIndex(t=>t.id===editId);
    STATE.transactions[idx] = tx;
    showToast('Transaction updated.');
  } else {
    tx.id = uid();
    STATE.transactions.push(tx);
    showToast('Saved.');
  }
  saveData();
  closeModal();
  renderView();
  populateMonthSelect();
}
/* =========================================================================
   AUTH — sign up / sign in / sign out, per-user session handling
   ========================================================================= */
let authTab = 'login';
function setAuthTab(tab){
  authTab = tab;
  document.getElementById('authTabLogin').classList.toggle('active', tab==='login');
  document.getElementById('authTabSignup').classList.toggle('active', tab==='signup');
  document.getElementById('authError').style.display='none';
  document.getElementById('authNotice').style.display='none';
  renderAuthForm();
}
function pwField(id, label, placeholder, autocomplete){
  return `<div class="field"><label>${label}</label><div class="pw-wrap">
    <input type="password" id="${id}" autocomplete="${autocomplete}" placeholder="${placeholder||''}">
    <button type="button" class="pw-eye" onclick="togglePwVisibility('${id}', this)" title="Show/hide password">👁</button>
  </div></div>`;
}
function togglePwVisibility(id, btn){
  const inp = document.getElementById(id);
  const showing = inp.type === 'text';
  inp.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '👁' : '🙈';
}
function renderAuthForm(){
  const wrap = document.getElementById('authFormWrap');
  if(authTab==='login'){
    wrap.innerHTML = `
      <div class="field"><label>Username or Email</label><input type="text" id="authIdentifier" autocomplete="username" placeholder="yourname or you@email.com"></div>
      ${pwField('authPassword','Password','','current-password')}
      <button class="btn btn-primary btn-block" id="authSubmitBtn" onclick="handleLogin()">Sign In</button>
    `;
  } else {
    wrap.innerHTML = `
      <div class="field"><label>Full Name</label><input type="text" id="authFullName" autocomplete="name" placeholder="Your complete name"></div>
      <div class="field"><label>Username</label><input type="text" id="authUsername" autocomplete="off" placeholder="Pick a unique username"></div>
      <div class="field"><label>Email</label><input type="email" id="authEmail" autocomplete="username" placeholder="you@email.com"></div>
      ${pwField('authPassword','Password','At least 6 characters','new-password')}
      ${pwField('authPasswordConfirm','Confirm Password','Re-enter your password','new-password')}
      <button class="btn btn-primary btn-block" id="authSubmitBtn" onclick="handleSignup()">Create Account</button>
    `;
  }
  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ authTab==='login' ? handleLogin() : handleSignup(); } });
  });
}
function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('authNotice').style.display = 'none';
}
function setAuthBusy(busy){
  const btn = document.getElementById('authSubmitBtn');
  if(btn) btn.disabled = busy;
}
async function handleLogin(){
  const identifier = readVal('authIdentifier');
  const password = document.getElementById('authPassword').value;
  document.getElementById('authError').style.display='none';
  if(!identifier || !password){ showAuthError('Please enter your username/email and password.'); return; }
  setAuthBusy(true);
  let email = identifier;
  if(!identifier.includes('@')){
    const { data: resolvedEmail, error: lookupErr } = await sb.rpc('get_email_for_username', { uname: identifier });
    if(lookupErr || !resolvedEmail){
      setAuthBusy(false);
      showAuthError('No account found with that username.');
      return;
    }
    email = resolvedEmail;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  setAuthBusy(false);
  if(error){ showAuthError(error.message); }
}
async function handleSignup(){
  const fullName = readVal('authFullName');
  const username = readVal('authUsername');
  const email = readVal('authEmail');
  const password = document.getElementById('authPassword').value;
  const passwordConfirm = document.getElementById('authPasswordConfirm').value;
  document.getElementById('authError').style.display='none';
  if(!fullName || !username || !email || !password || !passwordConfirm){ showAuthError('Please fill in all fields.'); return; }
  if(!/^[a-zA-Z0-9_.]{3,20}$/.test(username)){ showAuthError('Username should be 3-20 characters: letters, numbers, "_" or "." only.'); return; }
  if(password.length < 6){ showAuthError('Password must be at least 6 characters.'); return; }
  if(password !== passwordConfirm){ showAuthError('Passwords do not match.'); return; }
  setAuthBusy(true);
  const { data: taken, error: checkErr } = await sb.rpc('is_username_taken', { uname: username });
  if(checkErr){ setAuthBusy(false); showAuthError('Could not verify username right now. Please try again.'); return; }
  if(taken){ setAuthBusy(false); showAuthError('That username is already taken. Please choose another.'); return; }
  const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ username, full_name: fullName } } });
  setAuthBusy(false);
  if(error){ showAuthError(error.message); return; }
  const notice = document.getElementById('authNotice');
  if(!data.session){
    notice.innerHTML = `Signup successful! Please check your email to verify your account before signing in.<br><a href="https://mail.google.com" target="_blank" rel="noopener" style="color:var(--signal);font-weight:600;">Open Gmail →</a>`;
  } else {
    notice.textContent = 'Signup successful! You are now signed in.';
  }
  notice.style.display = 'block';
  if(!data.session) setAuthTab('login');
}
async function handleSignOut(){
  await sb.auth.signOut();
}
function showAuthScreen(){
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
  CURRENT_USER = null;
  setAuthTab('login');
}
function showApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
}
async function onAuthenticated(user){
  CURRENT_USER = user;
  showApp();
  await loadData();
  CURRENT_MONTH = todayISO().slice(0,7);
  renderNav();
  populateMonthSelect();
  renderView();
  const badge = document.getElementById('userBadge');
  if(badge) badge.textContent = user.user_metadata && user.user_metadata.username ? user.user_metadata.username : user.email;
}
/* =========================================================================
   THEME — light / dark toggle, persisted locally
   ========================================================================= */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('sp_theme', theme); }catch(e){}
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('sp_theme'); }catch(e){}
  if(!saved){ saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  applyTheme(saved);
}
/* =========================================================================
   INIT
   ========================================================================= */
async function init(){
  initTheme();
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{
    if(e.target.id==='modalOverlay') closeModal();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape') closeModal();
  });
  renderAuthForm();
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    await onAuthenticated(session.user);
  } else {
    showAuthScreen();
  }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_IN' && session && (!CURRENT_USER || CURRENT_USER.id !== session.user.id)){
      onAuthenticated(session.user);
    }
    if(event==='SIGNED_OUT'){
      showAuthScreen();
    }
  });
}
init();
</script>
