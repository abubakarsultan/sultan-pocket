<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Sultan Pocket</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#F8F7F4;color:#141414;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .box{max-width:380px;text-align:center;border:1px solid #E5E3DD;border-radius:16px;padding:32px;background:#fff;}
  h1{margin:0 0 8px;font-size:20px;}
  p{color:#6b6b6b;margin:0 0 20px;font-size:14px;}
  button{padding:10px 20px;border-radius:999px;border:none;background:#0057FF;color:#fff;cursor:pointer;font-weight:600;font-size:14px;}
</style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>Sultan Pocket needs an internet connection to show your latest balances and transactions. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
