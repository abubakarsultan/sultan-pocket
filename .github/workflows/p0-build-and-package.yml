name: P0 build and package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
      NEXT_PUBLIC_SITE_URL: https://sultanpocket.online
      OPENROUTER_API_KEY: build-only-placeholder
      OPENROUTER_MODEL: openrouter/free
      RESEND_API_KEY: build-only-placeholder
      CONTACT_RECEIVER_EMAIL: build@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Create source ZIP
        run: |
          zip -r sultan-pocket-p0.zip . \
            -x '.git/*' 'node_modules/*' '.next/*' '*.zip'

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sultan-pocket-p0
          path: sultan-pocket-p0.zip
          retention-days: 14
